[package]
name = "tcpdump-dev"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.2.1"
